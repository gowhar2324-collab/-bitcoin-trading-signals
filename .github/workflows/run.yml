name: Bitcoin Weekly Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  signal:
    runs-on: ubuntu-latest
    env:
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install yfinance pandas pybit

      - name: Run Bitcoin signal
        run: python signal_bot.py
